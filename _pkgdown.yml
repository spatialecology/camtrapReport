llm-docs: false

url: https://spatialecology.github.io/camtrapReport/

template:
  bootstrap: 5
  bslib:
    primary: "#146353"
    secondary: "#52645c"
    light: "#f0f5f1"
    dark: "#123e35"
    base_font: "system-ui"
    heading_font: "system-ui"
    code_font: "ui-monospace"

home:
  title: camtrapReport
  description: >
    Reproducible data assessment and ecological reporting for
    camera-trap monitoring using Camtrap DP.
  sidebar:
    structure: [toc]

navbar:
  bg: primary
  type: dark
  structure:
    left:
      - home
      - guides
      - catalog
      - resources
      - reference
    right:
      - search
      - about
      - github

  components:
    home:
      text: Get started
      href: index.html

    guides:
      text: Guides
      menu:
        - text: Package Overview
          href: articles/Package-Overview.html
        - text: Data Status Check
          href: articles/data-status-report.html
        - text: Ecological Report
          href: articles/ecological-report.html
        - text: Module Management
          href: articles/modules.html
        - text: Analytical Profiles
          href: articles/profiles.html

    catalog:
      text: Module Catalog
      href: articles/module-catalog.html

    resources:
      text: Resources
      href: articles/resources.html

    reference:
      text: Reference
      href: reference/index.html

    about:
      text: Project
      menu:
        - text: Report a bug
          icon: fa-bug
          href: https://github.com/spatialecology/camtrapReport/issues/new/choose
        - text: Ask a question
          icon: fa-comments
          href: https://github.com/spatialecology/camtrapReport/discussions
        - text: -------
        - text: Authors
          href: authors.html
        - text: Citation
          href: authors.html#citation
        - text: License
          href: LICENSE.html
        - text: Contributing guide
          href: CONTRIBUTING.html
        - text: Code of conduct
          href: CODE_OF_CONDUCT.html

    github:
      icon: fab fa-github
      href: https://github.com/spatialecology/camtrapReport
      aria-label: GitHub repository

articles:
  - title: Guides
    desc: >
      Practical guidance for importing data, assessing data status,
      generating reports, and managing analytical modules and profiles.
    contents:
      - 'matches("^Package-Overview$")'
      - 'matches("^articles/data-status-report$")'
      - 'matches("^articles/ecological-report$")'
      - 'matches("^articles/modules$")'
      - 'matches("^articles/profiles$")'

  - title: Module Catalog
    desc: >
      Searchable documentation of Data Status Check and Ecological Report modules.
    contents:
      - 'matches("^articles/module-catalog$")'

  - title: Resources
    desc: >
      Publications, workshops, and training resources.
    contents:
      - 'matches("^articles/resources$")'

reference:
  - title: Data input and metadata
    desc: >
      Import Camtrap DP data and manage report metadata.
    contents:
      - camData
      - info

  - title: Report generation
    desc: >
      Generate data-status and ecological reports or use the graphical interface.
    contents:
      - report
      - gui

  - title: Configure report contents
    desc: >
      Select report sections and configure reusable analytical profiles.
    contents:
      - section_names
      - reportProfile
      - updateReportSection

  - title: Module development and management
    desc: >
      Create, test, manage, and inspect report modules.
    contents:
      - reportSection
      - testSection
      - modules
      - install_all

  - title: Core class
    desc: >
      Low-level documentation of the camReport class.
    contents:
      - camReport-classes
