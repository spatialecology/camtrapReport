llm-docs: false

url: https://spatialecology.github.io/camtrapReport/

template:
  bootstrap: 5
  bslib:
    primary: "#146353"
    secondary: "#52645c"
    light: "#f0f5f1"
    dark: "#123e35"
    base_font: "system-ui"
    heading_font: "system-ui"
    code_font: "ui-monospace"

home:
  title: camtrapReport
  description: >
    An R package for processing camera-trap data and generating
    reproducible wildlife monitoring reports.
  sidebar:
    structure: [toc]

navbar:
  bg: primary
  type: dark
  structure:
    left:
      - home
      - articles
      - profiles
      - modules
      - reference

    right:
      - search
      - about
      - github

  components:
    home:
      text: Get started
      href: index.html

    articles:
      text: Guides
      menu:
        - text: Package Overview
          href: articles/Package-Overview.html

        - text: Data Status Check
          href: articles/data-status-report.html

        - text: Ecological Report
          href: articles/ecological-report.html

        - text: Resources and training
          href: articles/resources.html

    profiles:
      text: Profiles
      href: articles/profiles.html

    modules:
      text: Modules
      href: articles/modules.html

    reference:
      text: Reference
      href: reference/index.html

    about:
      text: Project
      menu:
        - text: Report a bug
          icon: fa-bug
          href: https://github.com/spatialecology/camtrapReport/issues/new/choose

        - text: Ask a question
          icon: fa-comments
          href: https://github.com/spatialecology/camtrapReport/discussions

        - text: -------

        - text: Authors
          href: authors.html

        - text: Citation
          href: authors.html#citation

        - text: License
          href: LICENSE.html

        - text: Contributing guide
          href: CONTRIBUTING.html

        - text: Code of conduct
          href: CODE_OF_CONDUCT.html

    github:
      icon: fab fa-github
      href: https://github.com/spatialecology/camtrapReport
      aria-label: GitHub repository

articles:
  - title: User guides
    desc: >
      Guides for importing camera-trap data, checking data quality,
      generating ecological reports, and customising report modules.
    contents:
      - Package-Overview
      - articles/data-status-report
      - articles/ecological-report
      - articles/profiles
      - articles/modules

  - title: Resources
    desc: >
      Publications, workshops, and training resources related to
      camtrapReport.
    contents:
      - articles/resources

reference:
  - title: Data input and metadata
    desc: >
      Create a camReport object from Camtrap DP data and inspect or
      update report metadata.

    contents:
      - camData
      - info

  - title: Report generation
    desc: >
      Generate the Data Status Check or Ecological Report, or use the
      graphical interface.

    contents:
      - report
      - gui

  - title: Configure report contents
    desc: >
      Inspect, select, and update sections and reusable report profiles.

    contents:
      - section_names
      - reportProfile
      - updateReportSection

  - title: Module development and management
    desc: >
      Create, test, add, move, remove, restore, and inspect report
      modules.

    contents:
      - reportSection
      - testSection
      - modules
      - install_all

  - title: Core class
    desc: >
      Low-level documentation for the camReport class. Most users
      should create camReport objects with camData() rather than
      interacting with the class directly.

    contents:
      - camReport-classes
