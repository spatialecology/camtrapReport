text: |
  This report provides an overview of the camera trap dataset and the preprocessing steps used for automated report generation. It enables users to assess their data through a series of automated checks. The standard report has five chapters: Setup (including spatial and temporal checks), Data Availability, Validation, Annotation, and Observation Types by Capture Method. A custom profile may select only some of these sections.

  Review the individual check results, missing values, and warnings before interpreting ecological analyses. The report does not compute an overall quality grade or automatically prevent ecological report generation when issues are present. A successfully rendered report is not a certification that a dataset or survey design is suitable for a particular analysis.

  Correct issues in the source dataset as needed, reload it with `camData(..., update = TRUE)`, and regenerate the Data Status Check. Rerunning `status()` on the existing object alone does not reread modified source files.
  
