text: |
  The Data Status Check provides an overview of the camera-trap dataset and summarises automated checks for data completeness, internal consistency and potential quality issues. The default report comprises five sections: Setup (including spatial and temporal checks), Data Availability, Validation, Annotation, and Observation Types by Capture Method.

  The report provides a structured summary of data quality, highlighting potential issues and limitations that may affect subsequent ecological analyses. Users can review and correct flagged issues in their original data management platforms, such as Agouti or TRAPPER, save the corrected data and rerun the checks before generating the Ecological Report.

