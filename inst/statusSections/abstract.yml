text: |
  This report provides an overview of the camera trap dataset and the preprocessing steps used for automated report generation. It enables users to quickly assess the quality of their data through a concise summary generated by a series of automated checks. The standard report is structured into five chapters: Setup (including spatial and temporal checks), Data Availability, Validation, Annotation, and Observation Types by Capture Method. A custom profile may select only some of these sections.

  The following qualitative descriptions can help you interpret the individual check results. They are a user-assessed guide, not an automatically calculated classification:

  - [Perfect]{{style="color: ForestGreen; font-weight: bold;"}}: No issues were identified in the checks you reviewed. This does not establish that every assumption of an ecological analysis is satisfied.
  - [Acceptable]{{style="color: #946000; font-weight: bold;"}}: Minor issues were identified. Assess their implications for the intended analysis and make corrections where needed.
  - [Needs Improvement]{{style="color: #B42318; font-weight: bold;"}}: Major issues were identified. Resolve them before relying on the affected analyses.

  *Note*: To improve the quality of automated camera-trap reporting, review missing values, warnings, and inconsistencies and document any corrections or exclusions. The package does not assign an overall quality grade or automatically block report generation. A successfully rendered report is not a certification of data quality or analytical suitability.

  After correcting source files, reload them with `camData(..., update = TRUE)` and regenerate the Data Status Check. Rerunning `status()` on the existing object alone does not reread modified source files.
  
