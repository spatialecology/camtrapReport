text: |
  The checklist above summarizes the results of the data quality checks. Identified issues should be reviewed in relation to the intended analyses; not all warnings necessarily require correction.

  Perfect, Acceptable, and Needs Improvement are qualitative descriptions provided to guide users in evaluating data quality. No overall classification is calculated by this report.

  It is recommended to resolve relevant data issues and document any corrections or exclusions. After modifying the source data, reload them using `camData(..., update = TRUE)` and rerun `status()` before proceeding with `report()`. A successfully generated report does not establish that the dataset meets the assumptions of the selected ecological analyses.
