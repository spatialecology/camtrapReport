  Review the spatial, temporal, data-availability, validation, and annotation results together before interpreting an ecological report. These checks identify potential data issues but do not compute a single overall quality grade or establish suitability for an ecological model.

  Investigate missing or inconsistent records and document any corrections or exclusions. After editing source data, reload them with `camData(..., update = TRUE)` and rerun `status()`. Retain the corrected inputs, selected modules, settings, and package versions with your analysis.
