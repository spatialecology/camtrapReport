text: |
  Based on results across the five key areas - Spatial, Temporal, Data Availability, Validation, and Annotation - assess whether the dataset needs further correction before ecological interpretation. Also review the Observation Types by Capture Method chapter when included in your profile.

  Use the qualitative descriptions in the Abstract as a user-assessed guide: Perfect for checks reviewed without identified issues, Acceptable for minor issues requiring assessment, and Needs Improvement for major issues requiring correction. No overall classification is calculated by this report; in particular, it does not label every dataset Acceptable or automatically prevent report generation.

  Investigate missing or inconsistent records and document any corrections or exclusions. After editing source data, reload them with `camData(..., update = TRUE)` and rerun `status()`. Retain the corrected inputs, selected modules, settings, and package versions with your analysis. A successful report does not establish that the survey design or data meet the assumptions of the selected ecological methods.
