name: "sampling"
title: "Sampling"
parent: "methods"
text: null
code: |
  #| name: sampling_table
  #| setting: echo=FALSE, results='asis', message=FALSE, warning=FALSE
  #| packages: gt, dplyr
  
  
  cat(object$reportTextElements$sampling,"More detailed information on camera-trap deployments by survey year is provided in the summarized information table below.\n")
  
  object$camera_setup |>
      gt::gt() |>
      gt::tab_header(
        title = gt::md("**📷 Camera Deployment Summary**"),
        subtitle = gt::md(paste0(object$getTableNumber()," Details of camera deployments per year"))
      ) |>
      gt::cols_label(
        year = "Year",
        number_camtraps = "Camera Traps",
        deployment_period = "Deployment Period",
        setup_period = "Setup Period",
        pickup_period = "Pickup Period"
      ) |>
      gt::tab_options(
        table.font.size = gt::px(14),
        heading.title.font.size = gt::px(16),
        heading.subtitle.font.size = gt::px(12),
        row.striping.include_table_body = TRUE
      ) |>
      gt::opt_row_striping() |>
      gt::tab_style(
        style = list(
          gt::cell_borders(sides = "bottom", color = "gray", weight = gt::px(1))
        ),
        locations = gt::cells_body()
      ) |>
      gt::tab_style(
        style = list(
          gt::cell_text(weight = "bold")
        ),
        locations = gt::cells_column_labels()
      )
