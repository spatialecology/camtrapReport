name: "population_density"
title: "## Population Density Estimation"
parent: "results"
text: >-
  Population density was estimated using the Random Encounter Model (REM) for
  species with sufficient data to support parameter estimation (Palencia et
  al., 2022). The pooled analysis fits one set of radius, angle, movement-speed,
  and activity parameters to all sampling years for each species, then combines
  those parameters with the trap rate from each year. Event-level Camtrap DP
  counts are summed as numbers of observed individuals. This pooled approach
  assumes that the fitted parameters are sufficiently stable among years; it
  should not be interpreted as an arithmetic average of annual parameter
  estimates.
