---
name: "population_densities_eow"
title: "### Population Density Estimates {.tabset}"
parent: "population_density_annual"
text: "The plots below show annual population density estimates for each study species, together with 95% confidence intervals. These estimates allow comparison of temporal variation in density across survey years.\n\n"
code: |
  #| name: population_density
  #| setting: echo=FALSE, results="asis", warning=FALSE, message=FALSE, fig.width=13.5, fig.height=11, out.width="100%", fig.align="center", dpi=150
  #| packages: ggplot2, dplyr, patchwork
  
  library(ggplot2)
  library(dplyr)
  library(patchwork)
  
  if (
    !exists("estimates_rem") ||
      is.null(estimates_rem) ||
      !"parameterScope" %in% names(estimates_rem) ||
      !all(estimates_rem$parameterScope == "annual")
  ) {
    
    spn <- object$get_speciesNames(object$setting$focus_groups)
    spn <- unique(spn[!is.na(spn) & nzchar(spn)])
    
    rem_list <- list()
    
    if (length(spn) > 0) {
      for (sp in spn) {
        tmp <- try(
          object$get_REM(
            sp,
            parameter_scope = "annual",
            reps = 999L,
            seed = 42L
          ),
          silent = TRUE
        )
        
        if (!inherits(tmp, "try-error") && !is.null(tmp) && length(tmp) > 0) {
          tmp_df <- try(dplyr::bind_rows(tmp), silent = TRUE)
          
          if (!inherits(tmp_df, "try-error") && is.data.frame(tmp_df) && nrow(tmp_df) > 0) {
            rem_list[[sp]] <- tmp_df
          }
        }
      }
    }
    
    estimates_rem <- dplyr::bind_rows(rem_list)
  }
  
  if (exists("estimates_rem") && !is.null(estimates_rem) && nrow(estimates_rem) > 0) {
    
    density_data <- estimates_rem |>
      dplyr::filter(.data$Metric == "density") |>
      dplyr::filter(!is.na(.data$scientificName)) |>
      dplyr::filter(!is.na(.data$Year)) |>
      dplyr::filter(as.character(.data$Year) != "9999") |>
      dplyr::mutate(
        Year = suppressWarnings(as.numeric(as.character(.data$Year))),
        estimate = suppressWarnings(as.numeric(.data$estimate)),
        lcl95 = suppressWarnings(as.numeric(.data$lcl95)),
        ucl95 = suppressWarnings(as.numeric(.data$ucl95))
      ) |>
      dplyr::filter(
        is.finite(.data$Year),
        is.finite(.data$estimate)
      )
    
    if (nrow(density_data) > 0) {
      
      species_list <- unique(density_data$scientificName)
      
      species_colors <- stats::setNames(
        rep(object$reportObjectElements$color_palette, length.out = length(species_list)),
        species_list
      )
      
      plot_list <- list()
      unstable_species <- character()
      
      for (i in seq_along(species_list)) {
        
        species <- species_list[i]
        
        species_data <- density_data |>
          dplyr::filter(.data$scientificName == species) |>
          dplyr::arrange(.data$Year) |>
          dplyr::mutate(
            scientificName = factor(.data$scientificName, levels = species_list)
          )
        
        if (nrow(species_data) == 0) next
        
        finite_est <- species_data$estimate[is.finite(species_data$estimate)]
        finite_ucl <- species_data$ucl95[is.finite(species_data$ucl95)]
        
        max_est <- max(finite_est, na.rm = TRUE)
        max_ucl <- if (length(finite_ucl) > 0) {
          max(finite_ucl, na.rm = TRUE)
        } else {
          NA_real_
        }
        
        unstable_ci <- is.finite(max_ucl) &&
          is.finite(max_est) &&
          max_est > 0 &&
          max_ucl > 5 * max_est
        
        if (unstable_ci) {
          unstable_species <- c(unstable_species, species)
          y_upper <- max_est * 1.6
        } else {
          y_upper <- max(c(species_data$estimate, species_data$ucl95), na.rm = TRUE) * 1.08
        }
        
        if (!is.finite(y_upper) || y_upper <= 0) {
          y_upper <- max(species_data$estimate, na.rm = TRUE) * 1.2
        }
        
        species_data <- species_data |>
          dplyr::mutate(
            lcl95_plot = dplyr::if_else(
              is.finite(.data$lcl95),
              pmax(.data$lcl95, 0),
              NA_real_
            ),
            ucl95_plot = dplyr::if_else(
              is.finite(.data$ucl95),
              pmin(.data$ucl95, y_upper),
              NA_real_
            )
          )
        
        p <- ggplot2::ggplot(
          species_data,
          ggplot2::aes(
            x = factor(.data$Year),
            y = .data$estimate,
            fill = .data$scientificName
          )
        ) +
          ggplot2::geom_col(
            width = 0.6,
            show.legend = TRUE
          ) +
          ggplot2::scale_fill_manual(
            values = species_colors,
            drop = FALSE,
            name = "Species"
          )
        
        if (any(is.finite(species_data$lcl95_plot)) && any(is.finite(species_data$ucl95_plot))) {
          p <- p +
            ggplot2::geom_errorbar(
              ggplot2::aes(
                ymin = .data$lcl95_plot,
                ymax = .data$ucl95_plot
              ),
              width = 0.18,
              color = "black",
              linewidth = 0.7,
              na.rm = TRUE
            )
        }
        
        p <- p +
          ggplot2::coord_cartesian(
            ylim = c(0, y_upper),
            clip = "off"
          ) +
          ggplot2::labs(
            x = "Year",
            y = expression(bold("Population density (km"^-2*")"))
          ) +
          ggplot2::theme_minimal(base_size = 12) +
          ggplot2::theme(
            axis.text.x = ggplot2::element_text(angle = 45, hjust = 1),
            axis.title.x = ggplot2::element_text(face = "bold", color = "black", size = 11),
            axis.title.y = ggplot2::element_text(face = "bold", color = "black", size = 11),
            panel.grid.minor = ggplot2::element_blank(),
            plot.margin = ggplot2::margin(4, 4, 4, 4)
          )
        
        plot_list[[species]] <- p
      }
      
      n_plots <- length(plot_list)
      
      if (n_plots > 0) {
        
        grid_plot <- patchwork::wrap_plots(plot_list) +
          patchwork::plot_layout(guides = "collect", axis_titles = "collect") &
          ggplot2::theme(
            legend.position = "right",
            legend.title = ggplot2::element_text(face = "bold", size = 11),
            legend.text = ggplot2::element_text(face = "italic", size = 10),
            legend.key.size = ggplot2::unit(0.8, "lines"),
            legend.margin = ggplot2::margin(0, 0, 0, 0),
            legend.box.margin = ggplot2::margin(0, 0, 0, 5)
          )
        
        print(grid_plot)

        if (length(unstable_species) > 0) {
          cat(paste0(
            "\n\n*Note: The confidence intervals for **", paste(unstable_species, collapse = ", "),
            "** are extremely wide relative to the point estimates. ",
            "The y-axis has been restricted for readability. ",
            "This indicates high uncertainty in the REM estimates and should be interpreted cautiously.*\n"
          ))
        }
        
        cat(
          "\n\n",
          object$getFigureNumber(),
          " *Estimated population density per sampling year for study species. Whiskers represent 95% confidence intervals.*\n\n",
          sep = ""
        )
      }
    }
  }
---
