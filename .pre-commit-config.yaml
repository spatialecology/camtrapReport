# Optional local checks. Nothing installs Git hooks automatically.
# No formatter, --fix option, spell checker or source rewriting is configured.
minimum_pre_commit_version: "3.2.0"
default_stages: [pre-commit]
exclude: ^(docs|pkgdown)/
repos:
  - repo: local
    hooks:
      - id: r-parse
        name: Parse R source and tests (no edits)
        language: system
        entry: >-
          Rscript --vanilla -e
          'invisible(lapply(commandArgs(trailingOnly = TRUE), function(file) parse(file = file)))'
        files: ^(R|tests)/.*\.[Rr]$
      - id: jarl-check
        name: Jarl checks (manual, no fixes)
        language: system
        entry: jarl check
        files: \.(R|r|Rmd|rmd|qmd)$
        stages: [manual]
      - id: r-tests
        name: Testthat suite (manual)
        language: system
        entry: >-
          Rscript --vanilla -e
          'testthat::test_local(stop_on_failure = TRUE)'
        pass_filenames: false
        always_run: true
        stages: [manual]
