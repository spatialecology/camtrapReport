name: pkgcheck

# Cancel a running job when a newer run is triggered
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.workflow_run.head_sha || github.ref
    }}
  cancel-in-progress: true

on:
  # Manually trigger the workflow under Actions/pkgcheck
  workflow_dispatch:

  # Wait for the slowest CI workflow so pkgcheck does not evaluate a
  # still-pending R CMD check as a failure.
  workflow_run:
    workflows: ["R-CMD-check.yaml"]
    types: [completed]
    branches: [main, master]

jobs:
  pkgcheck:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha || github.ref }}

      - name: Mark repository as safe for pkgcheck
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/_github_home"
          git config \
            --file "${RUNNER_TEMP}/_github_home/.gitconfig" \
            --add safe.directory /github/workspace

      - name: Free disk space for pkgcheck Docker image
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h /

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          echo "Disk space after cleanup:"
          df -h /

      - name: Run pkgcheck
        uses: ropensci-review-tools/pkgcheck-action@main
        env:
          # Configure repositories and apply the CI Markdown formatter workaround.
          R_PROFILE_USER: /github/workspace/.github/pkgcheck-profile.R
        with:
          ref: ""
